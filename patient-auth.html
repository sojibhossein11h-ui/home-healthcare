<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নিরাপদ লগইন — হোম হেলথ কেয়ার</title><style>body{font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4f8fb;color:#17324d;margin:0;padding:20px}.box{max-width:520px;margin:30px auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 6px 24px #1232}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d4e0e8;border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#087f5b;color:#fff;font-weight:700}.back{display:inline-block;margin-bottom:18px;text-decoration:none}.msg{margin-top:12px;font-weight:700}</style></head>
<body><main class="box"><a class="back" href="./">← হোমে ফিরুন</a><h1>🔐 নিরাপদ লগইন</h1><p>রোগীর নাম লেখার সময় কোনো Gmail/Google লগইন দেখানো হবে না। লগইন আলাদা ধাপে হবে।</p><div class="field"><label>ইমেইল</label><input id="authEmail" type="email" autocomplete="username" placeholder="আপনার ইমেইল"></div><div class="field"><label>পাসওয়ার্ড</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="কমপক্ষে ৬ অক্ষর"></div><button class="btn" onclick="signUp()">নতুন অ্যাকাউন্ট</button> <button class="btn" onclick="signIn()">লগইন</button><div id="authMsg" class="msg"></div><div id="sessionMsg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script></body></html>

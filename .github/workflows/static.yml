name: Deploy Home Healthcare to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static files
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          python - <<'PY'
          import json
          with open('manifest.json', encoding='utf-8') as f:
              json.load(f)
          print('Static file validation passed')
          PY

      - name: Fix patient name input behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<input id="name" placeholder="নাম লিখুন">'
          new = '<input id="name" name="patientName" type="text" autocomplete="name" autocapitalize="words" inputmode="text" spellcheck="false" placeholder="নাম লিখুন">'
          if old not in s:
              raise SystemExit('Patient name input pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Patient name input configured as a text/name field; email autofill is not requested.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
